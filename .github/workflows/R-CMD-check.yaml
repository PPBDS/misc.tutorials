# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      # For Linux, install ALL spatial and system dependencies
      - name: Install system dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libudunits2-dev \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libsqlite3-dev \
            libtiff-dev \
            libgeotiff-dev \
            libicu-dev \
            libjpeg-dev \
            libpng-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true

  # R-CMD-check above installs ALL dependencies, including Suggests, so it
  # cannot catch failures that only occur for students, whose devcontainer
  # image has exactly this package's Suggests baked (via the image's
  # dependencies = TRUE install) and nothing more. This job renders every
  # tutorial inside the ACTUAL image students' Codespaces run --
  # ghcr.io/ppbds/devcontainer, built by PPBDS/devcontainers -- after
  # installing this package the way a student update does (hard
  # dependencies only). If this job is green, the tutorials render for
  # students; if a tutorial needs a package the image lacks (a new or
  # undeclared Suggests, or an invisible render-time dependency like the
  # 2026-07 katex incident in primer.tutorials), this job fails exactly
  # the way a codespace would -- the signal to cut an image release.
  # The image tag is read LIVE from codespace-starter's devcontainer.json, so
  # this job always tests against the image students are actually running and
  # a repin of codespace-starter needs no edit here (until 2026-10-30 the tag
  # was hardcoded and had to be bumped in lockstep by hand). A container
  # image cannot be computed inside its own job, hence the small job before it.
  pin:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.get.outputs.image }}
    steps:
      - id: get
        run: |
          img="$(curl -fsSL https://raw.githubusercontent.com/PPBDS/codespace-starter/main/.devcontainer/devcontainer.json \
                 | grep -o 'ghcr\.io/ppbds/devcontainer:[0-9][0-9.]*' | head -1)"
          if [ -z "$img" ]; then
            echo "::error::could not read the image pin from PPBDS/codespace-starter devcontainer.json"
            exit 1
          fi
          echo "image=$img" >> "$GITHUB_OUTPUT"
          echo "testing against $img"

  student-env-render:
    needs: pin
    runs-on: ubuntu-latest
    name: render tutorials in the student devcontainer

    container:
      image: ${{ needs.pin.outputs.image }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - name: Install this package the way students do (hard deps only)
        run: R -q -e 'pak::local_install(".", ask = FALSE)'

      - name: Render all tutorials
        run: |
          paths <- learnr2::available_tutorials(package = "misc.tutorials", type = "quarto")$path
          learnr2::render_tutorials(paths)
        shell: Rscript {0}